<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Medical Decision Support System{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-hospital"></i>
                <span>Medico</span>
            </div>
            <ul class="nav-menu">
                <li><a href="/" class="nav-link {% block nav_home %}{% endblock %}">Home</a></li>
                <li><a href="/assessment" class="nav-link {% block nav_assessment %}{% endblock %}">Assessment</a></li>
                <li><a href="/history" class="nav-link {% block nav_history %}{% endblock %}">History</a></li>
                <li><a href="/about" class="nav-link {% block nav_about %}{% endblock %}">About</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2024 Medical Decision Support System. All rights reserved.</p>
        <p>Disclaimer: This system is for educational purposes only and should not replace professional medical advice.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
